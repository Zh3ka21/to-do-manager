{% block content %}
<div class="auth-container">
    <h2>Login</h2>

    <form method="post">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        {% csrf_token %}
        <div class="form-group">
            {{ form.login.errors }}
            {{ form.login }}
        </div>
        <div class="form-group">
            {{ form.password.errors }}
            {{ form.password }}
        </div>

        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p>Don't have an account? <a href="{% url 'custom_signup' %}?next={{ request.path }}">Sign up</a></p>
    <p><a href="{% url 'account_reset_password' %}">Forgot your password?</a></p>
    <p><a href="{% url 'base_view_handler' %}">Go back to the main page</a></p>
</div>
{% endblock %}
